name: real-linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:20.04
          - debian:12
          - almalinux:9
          - rockylinux:8
          - fedora:latest
          - opensuse/leap:15
          - archlinux:latest
          - alpine:3.20
          - alpine:3.10
          - bash:3.2
          - bash:4.0
          - centos:7
          - centos:6
          - ubuntu:18.04
          - ubuntu:16.04
          - ubuntu:14.04
          - debian:10
          - debian:9
          - debian:8
          - oraclelinux:8
          - amazonlinux:2
          - opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4
      - name: Run every view
        run: |
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" sh -c '
            if command -v apk >/dev/null && ! command -v bash >/dev/null; then apk add -q bash; fi
            if ! command -v awk >/dev/null; then
                bash /w/linux-host-audit.sh --overview
                test $? = 3 || exit 1
                if ! zypper -n -q install gawk || ! command -v awk >/dev/null; then
                    echo "Package mirror unavailable. The no-awk path above is what this job proved."
                    exit 0
                fi
            fi
            bash /w/tests/real-smoke.sh && bash /w/tests/parse-real.sh'

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full report on a real systemd host, as root and as a normal user
        run: |
          sudo bash tests/real-smoke.sh
          bash tests/real-smoke.sh
          sudo bash tests/listeners-real.sh
          sudo bash linux-host-audit.sh --problems | tee problems.txt
          ! grep -F 'disk errors' problems.txt
          sudo bash linux-host-audit.sh --json | python3 -m json.tool > report.json
          python3 -c "import json; d = json.load(open('report.json')); assert all(f['id'] != 'unknown' for f in d['findings']); print(d['host'])"

  tuning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'mariadb:10.5', env: 'MARIADB_ROOT_PASSWORD=t', expect: 'MariaDB 10.5', value: 'max_connections' }
          - { image: 'mariadb:10.6', env: 'MARIADB_ROOT_PASSWORD=t', expect: 'MariaDB 10.6', value: 'max_connections' }
          - { image: 'mariadb:10.11', env: 'MARIADB_ROOT_PASSWORD=t', expect: 'MariaDB 10.11', value: 'innodb_buffer_pool_size' }
          - { image: 'mariadb:11.4', env: 'MARIADB_ROOT_PASSWORD=t', expect: 'MariaDB 11.4', value: 'innodb_buffer_pool_size' }
          - { image: 'mariadb:11.8', env: 'MARIADB_ROOT_PASSWORD=t', expect: 'MariaDB 11.8', value: 'innodb_buffer_pool_size' }
          - { image: 'mysql:5.7', env: 'MYSQL_ROOT_PASSWORD=t', expect: 'MySQL 5.7', value: 'max_connections' }
          - { image: 'mysql:8.0', env: 'MYSQL_ROOT_PASSWORD=t', expect: 'MySQL 8.0', value: 'innodb_redo_log_capacity' }
          - { image: 'mysql:8.4', env: 'MYSQL_ROOT_PASSWORD=t', expect: 'MySQL 8.4', value: 'innodb_redo_log_capacity' }
          - { image: 'mysql:9.1', env: 'MYSQL_ROOT_PASSWORD=t', expect: 'MySQL 9.1', value: 'innodb_redo_log_capacity' }
          - { image: 'postgres:12', env: 'POSTGRES_PASSWORD=t', expect: 'PostgreSQL 12', value: 'shared_buffers' }
          - { image: 'postgres:16', env: 'POSTGRES_PASSWORD=t', expect: 'PostgreSQL 16', value: 'shared_buffers' }
          - { image: 'postgres:17', env: 'POSTGRES_PASSWORD=t', expect: 'PostgreSQL 17', value: 'shared_buffers' }
          - { image: 'postgres:18', env: 'POSTGRES_PASSWORD=t', expect: 'PostgreSQL 18', value: 'shared_buffers' }
          - { image: 'redis:6', env: 'X=1', expect: 'Redis 6', value: 'maxclients' }
          - { image: 'redis:7', env: 'X=1', expect: 'Redis 7', value: 'maxclients' }
          - { image: 'valkey/valkey:7.2', env: 'X=1', expect: 'Valkey 7.2', value: 'maxclients' }
          - { image: 'valkey/valkey:8', env: 'X=1', expect: 'Valkey 8', value: 'maxclients' }
          - { image: 'redis:8', env: 'X=1', expect: 'Redis 8', value: 'maxclients' }
          - { image: 'memcached:1.6', env: 'X=1', expect: 'Memcached 1.6', value: 'memcached open files' }
          - { image: 'rabbitmq:3.13', env: 'X=1', expect: 'RabbitMQ 3.13', value: 'vm_memory_high_watermark', wait: 40 }
          - { image: 'rabbitmq:4.0', env: 'X=1', expect: 'RabbitMQ 4.0', value: 'disk_free_limit', wait: 40 }
          - { image: 'clickhouse/clickhouse-server:24.8', env: 'CLICKHOUSE_SKIP_USER_SETUP=1', expect: 'ClickHouse 24.8', value: 'max_connections' }
          - { image: 'clickhouse/clickhouse-server:25.3', env: 'CLICKHOUSE_SKIP_USER_SETUP=1', expect: 'ClickHouse 25.3', value: 'max_concurrent_queries' }
          - { image: 'influxdb:1.8', env: 'X=1', expect: 'InfluxDB 1.8', value: 'no memory limit' }
          - { image: 'influxdb:2.7', env: 'X=1', expect: 'InfluxDB', value: 'no memory limit' }
          - { image: 'cassandra:4.1', env: 'X=1', expect: 'Cassandra 4.1', value: 'JVM services', wait: 90 }
          - { image: 'apache/kafka:3.8.0', env: 'X=1', expect: 'Kafka 3.8', value: 'JVM services', wait: 40 }
          - { image: 'elasticsearch:8.15.0', env: 'discovery.type=single-node;xpack.security.enabled=false;ES_JAVA_OPTS=-Xms512m -Xmx512m', expect: 'Elasticsearch 8.15', value: 'heap', wait: 60 }
          - { image: 'opensearchproject/opensearch:2.17.0', env: 'discovery.type=single-node;DISABLE_SECURITY_PLUGIN=true;DISABLE_INSTALL_DEMO_CONFIG=true;OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m', expect: 'OpenSearch 2.17', value: 'heap', wait: 60 }
          - { image: 'tomcat:10.1', env: 'X=1', expect: 'Tomcat', value: 'maxThreads' }
          - { image: 'caddy:2.8', env: 'X=1', expect: 'Caddy', value: 'open files' }
          - { image: 'traefik:v3.1', env: 'X=1', expect: 'Traefik', value: 'No metrics port' }
          - { image: 'node:22-slim', env: 'X=1', expect: 'Node.js', value: 'no limit set', command: 'node -e setInterval(()=>0,1000)', wait: 10 }
          - { image: 'python:3.12-slim', env: 'X=1', expect: 'Tuning and capacity', value: 'Server now', command: 'python -m http.server 8000', wait: 10 }
          - { image: 'mongo:6', env: 'X=1', expect: 'MongoDB 6', value: 'wiredTigerCacheSizeGB' }
          - { image: 'mongo:7', env: 'X=1', expect: 'MongoDB 7', value: 'maxIncomingConnections' }
          - { image: 'nginx:1.24', env: 'X=1', expect: 'Nginx 1.24', value: 'worker_connections' }
          - { image: 'nginx:1.27', env: 'X=1', expect: 'Nginx 1.27', value: 'worker_connections' }
          - { image: 'httpd:2.4', env: 'X=1', expect: 'Apache 2.4', value: 'MaxRequestWorkers' }
          - { image: 'php:7.4-fpm', env: 'X=1', expect: 'PHP-FPM pools', value: 'www (dynamic)' }
          - { image: 'php:8.3-fpm', env: 'X=1', expect: 'PHP-FPM pools', value: 'www (dynamic)' }
          - { image: 'php:8.4-fpm', env: 'X=1', expect: 'PHP-FPM pools', value: 'www (dynamic)' }
    steps:
      - uses: actions/checkout@v4
      - name: Read a real ${{ matrix.image }}, and compare with what it reports itself
        run: bash tests/tune-real.sh '${{ matrix.image }}' '${{ matrix.env }}' '${{ matrix.expect }}' '${{ matrix.value }}' '${{ matrix.command }}' '${{ matrix.wait }}'

  simulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulated servers, panels and version rules
        run: docker run --rm -v "$PWD:/w" -w /w debian:12 sh -c 'rm -f /.dockerenv; exec bash tests/run.sh'

  version-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings called live really change live on those versions
        run: bash tests/sql-real.sh
      - name: Debian Apache gives its MPM only through apache2ctl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2
          sudo systemctl start apache2
          out=$(sudo NO_COLOR=1 bash linux-host-audit.sh --tune)
          printf '%s\n' "$out" | grep -A6 'Apache 2'
          printf '%s\n' "$out" | grep -E 'Apache 2[.0-9]* \((event|prefork|worker)\)'

  plesk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read a real Plesk from the vendor's image
        run: bash tests/plesk-real.sh plesk/plesk:18.0

  fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The fixer file must match its sources, and the audit must hold no fix code
        run: |
          bash make-fix.sh
          git diff --exit-code linux-host-fix.sh
          ! grep -nE '(^|[^a-z_])(fx_[a-z]|ap_[a-z]+_[a-z]+\(\))' linux-host-audit.sh
      - name: Every finding id has a diagnosis, and every fix has a check
        run: |
          grep -oE 'fid=[a-z0-9-]+' linux-host-audit.sh | cut -d= -f2 | sort -u | while read -r id; do
              grep -q "^dx_${id//-/_}()" linux-host-fix.sh || { echo "NO DIAGNOSIS: $id"; exit 1; }
          done
          grep -oE '^ap_[a-z0-9_]+' linux-host-fix.sh | sed 's/^ap_//' | while read -r name; do
              grep -q "^ck_$name()" linux-host-fix.sh || { echo "NO CHECK: $name"; exit 1; }
          done
      - name: Break things for real, and fix them
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx ufw mariadb-server redis-server
          sudo LHA_I_AM_DISPOSABLE=yes bash tests/fix-real.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start containers in known states
        run: |
          docker run -d --name lha-good nginx:1.27-alpine
          docker run -d --name lha-sick --health-cmd=false --health-interval=1s --health-retries=1 nginx:1.27-alpine
          docker run -d --name lha-priv --privileged nginx:1.27-alpine
          docker run --name lha-failed alpine:3.20 sh -c 'exit 3' || true
          docker run -d --name lha-loop --restart=always alpine:3.20 sh -c 'exit 1'
          sleep 8
      - name: The audit must report each state
        run: |
          sudo bash linux-host-audit.sh --containers | tee out.txt
          for want in 'Container lha-sick is unhealthy' 'Container lha-loop keeps restarting' \
              'Container lha-failed stopped with error code 3' 'Container lha-priv runs in privileged mode' \
              'lha-good' 'Live usage per container' 'Disk used by images'; do
              grep -qF "$want" out.txt || { echo "MISSING: $want"; exit 1; }
          done
          ! grep -F 'Container lha-good is' out.txt

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='--disable=traefik' sh -
          for i in $(seq 1 60); do
              sudo k3s kubectl get nodes 2>/dev/null | grep -q ' Ready' && break
              sleep 2
          done
      - name: Create workloads in known states
        run: |
          sudo k3s kubectl create namespace lha
          for i in $(seq 1 30); do
              sudo k3s kubectl -n lha get serviceaccount default >/dev/null 2>&1 && break
              sleep 2
          done
          sudo k3s kubectl -n lha create deployment good --image=nginx:1.27-alpine
          sudo k3s kubectl -n lha create deployment badimage --image=registry.invalid/none:1
          sudo k3s kubectl -n lha run crash --image=alpine:3.20 --command -- sh -c 'exit 1'
          sleep 60
          sudo k3s kubectl get pods -A
      - name: The audit must report each state
        run: |
          sudo bash linux-host-audit.sh --k8s | tee out.txt
          for want in '1 of 1 ready' 'K3s' 'Pods that are not healthy' 'crash' 'badimage' \
              'deployments lack ready replicas' 'Latest warning events'; do
              grep -qF "$want" out.txt || { echo "MISSING: $want"; exit 1; }
          done
          ! grep -E 'SECRET|password=' out.txt
          sudo bash linux-host-audit.sh --overview | tee over.txt
          grep -qF 'Kubernetes cluster' over.txt
